<title>Tentajakt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: en sida millimeterpapper. Blå kulspetspenna, röd rättarpenna, gul överstrykningspenna.
   Kort med hård kantlinje och förskjuten skugga, som klistermärken på ett kollegieblock. */
:root {
  --paper: #E8EEF1;
  --card: #F8FAFB;
  --ink: #0F2236;
  --ink2: #4C6075;
  --grid: rgba(36, 87, 245, 0.11);
  --pen: #2457F5;
  --pen-ink: #FFFFFF;
  --hi: #FFE14D;
  --hi-ink: #1A1608;
  --ok: #0F8A58;
  --ok-bg: #D5F2E4;
  --bad: #D3303A;
  --bad-bg: #FBDFE1;
  --soft: #D6E0E6;
  --f-ui: "Familjen Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-math: "STIX Two Text", "Cambria Math", "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0B1727; --card: #12243A; --ink: #E8F0FA; --ink2: #93A8BF;
    --grid: rgba(110, 162, 255, 0.10); --pen: #6C9BFF; --pen-ink: #07111E;
    --hi: #FFD84D; --hi-ink: #1A1608; --ok: #43D08F; --ok-bg: #0F3A2A;
    --bad: #FF7A80; --bad-bg: #47191D; --soft: #1D3552; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0B1727; --card: #12243A; --ink: #E8F0FA; --ink2: #93A8BF;
  --grid: rgba(110, 162, 255, 0.10); --pen: #6C9BFF; --pen-ink: #07111E;
  --hi: #FFD84D; --hi-ink: #1A1608; --ok: #43D08F; --ok-bg: #0F3A2A;
  --bad: #FF7A80; --bad-bg: #47191D; --soft: #1D3552; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px;
  color: var(--ink);
  font-family: var(--f-ui);
  font-size: 16px;
  line-height: 1.4;
  -webkit-text-size-adjust: 100%;
}
#app { max-width: 520px; margin: 0 auto; padding-inline: 16px; padding-block: 14px 40px; }
button { font: inherit; color: inherit; }
.f { font-family: var(--f-math); }
sup, sub { font-size: 0.68em; line-height: 0; }
.ss { display: inline-flex; flex-direction: column; vertical-align: middle; font-size: 0.62em; line-height: 1.15; margin-inline: 0.12em; text-align: center; }
.ss sup, .ss sub { font-size: 1em; position: static; vertical-align: baseline; line-height: 1.15; }

/* knappar */
.btn {
  display: block; width: 100%; text-align: left; cursor: pointer;
  background: var(--card); color: var(--ink);
  border: 2px solid var(--ink); border-radius: 14px;
  padding: 14px 16px; font-weight: 600;
  box-shadow: 0 4px 0 var(--ink);
  transition: transform 0.08s ease, box-shadow 0.08s ease;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn:focus-visible, .zone:focus-visible, .opt:focus-visible, .ghost:focus-visible, summary:focus-visible, input:focus-visible { outline: 3px solid var(--pen); outline-offset: 3px; }
.btn.primary { background: var(--pen); color: var(--pen-ink); }
.btn.center { text-align: center; }
.ghost { background: none; border: 0; padding: 8px 4px; color: var(--ink2); font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; touch-action: manipulation; }

/* startsida */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
.chip { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 9px; border: 2px solid var(--ink); border-radius: 99px; background: var(--card); }
.chip.hi { background: var(--hi); color: var(--hi-ink); }
h1.brand { font-size: clamp(46px, 15vw, 64px); line-height: 0.95; letter-spacing: -0.03em; margin: 10px 0 6px; font-weight: 700; text-wrap: balance; }
h1.brand mark { background: var(--hi); color: var(--hi-ink); padding: 0 0.08em; border-radius: 4px; }
.lede { color: var(--ink2); margin: 0 0 18px; max-width: 34ch; }
.xp { margin: 0 0 20px; }
.xp-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-weight: 600; margin-bottom: 6px; }
.xp-row small { color: var(--ink2); font-weight: 500; font-variant-numeric: tabular-nums; }
.bar { height: 12px; border: 2px solid var(--ink); border-radius: 99px; background: var(--card); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--pen); border-radius: 99px; transition: width 0.25s ease; }
.bar.low > i { background: var(--bad); }
.stack { display: grid; gap: 14px; }
.btn small { display: block; font-weight: 500; opacity: 0.85; margin-top: 2px; }
.btn .big { font-size: 26px; letter-spacing: -0.01em; line-height: 1.1; font-weight: 700; display: block; }
.sec { display: flex; justify-content: space-between; align-items: baseline; margin: 30px 0 12px; }
.sec h2 { margin: 0; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; }
.sec span { color: var(--ink2); font-size: 13px; }
.zones { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.zone { text-align: left; background: var(--card); border: 2px solid var(--ink); border-radius: 14px; padding: 12px 12px 12px; box-shadow: 0 4px 0 var(--ink); cursor: pointer; display: flex; flex-direction: column; gap: 6px; min-width: 0; transition: transform 0.08s ease, box-shadow 0.08s ease; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.zone:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.zone b { font-size: 17px; line-height: 1.15; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.zone .sub { color: var(--ink2); font-size: 13px; line-height: 1.25; }
.zone .meta { margin-top: auto; padding-top: 6px; display: grid; gap: 6px; }
.zone .w { font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink2); }
.stars { font-size: 20px; letter-spacing: 2px; line-height: 1; }
.stars .on { color: var(--hi); -webkit-text-stroke: 1.2px var(--ink); }
.stars .off { color: var(--ink2); opacity: 0.55; }
.mini { height: 6px; background: var(--soft); border-radius: 99px; overflow: hidden; }
.mini > i { display: block; height: 100%; background: var(--ok); }
.foot { margin-top: 34px; color: var(--ink2); font-size: 13px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }

/* spelet */
.hud { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; min-height: 40px; }
.hud .lives { display: flex; gap: 6px; }
.pip { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--ink); background: var(--bad); }
.pip.gone { background: transparent; opacity: 0.45; }
.combo { background: var(--hi); color: var(--hi-ink); border: 2px solid var(--ink); border-radius: 99px; padding: 2px 11px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 54px; text-align: center; }
.combo.pop { animation: pop 0.3s ease; }
.score { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 4ch; text-align: right; }
.count { font-weight: 600; color: var(--ink2); font-variant-numeric: tabular-nums; }
.qcard { background: var(--card); border: 2px solid var(--ink); border-radius: 16px; padding: 18px 16px 20px; margin: 14px 0 18px; box-shadow: 0 4px 0 var(--ink); min-height: 132px; display: flex; flex-direction: column; gap: 10px; justify-content: center; }
.qcard .zn { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink2); }
.qtext { font-family: var(--f-math); font-size: clamp(24px, 7vw, 32px); line-height: 1.25; overflow-wrap: anywhere; }
.qtext.long { font-size: clamp(18px, 5vw, 21px); line-height: 1.35; }
.opts { display: grid; gap: 12px; }
.opt { display: flex; align-items: center; min-height: 58px; width: 100%; text-align: left; cursor: pointer; background: var(--card); color: var(--ink); border: 2px solid var(--ink); border-radius: 14px; padding: 10px 14px; box-shadow: 0 4px 0 var(--ink); font-family: var(--f-math); font-size: 20px; line-height: 1.25; overflow-wrap: anywhere; transition: transform 0.08s ease, box-shadow 0.08s ease; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.opt.long { font-size: 16.5px; }
.opt:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.opt:disabled { cursor: default; }
.opt.ok { background: var(--ok-bg); border-color: var(--ok); box-shadow: 0 4px 0 var(--ok); }
.opt.bad { background: var(--bad-bg); border-color: var(--bad); box-shadow: 0 4px 0 var(--bad); animation: shake 0.3s ease; }
.opt.dim { opacity: 0.5; }
.fb { margin-top: 18px; border: 2px solid var(--ink); border-radius: 14px; padding: 14px 16px; background: var(--card); display: grid; gap: 10px; }
.fb.ok { background: var(--ok-bg); border-color: var(--ok); }
.fb.bad { background: var(--bad-bg); border-color: var(--bad); }
.fb h3 { margin: 0; font-size: 18px; }
.fb p { margin: 0; }
.fb .ans { font-family: var(--f-math); font-size: 20px; }
.flash { position: fixed; left: 50%; top: 18%; transform: translateX(-50%); pointer-events: none; font-weight: 700; font-size: 22px; background: var(--hi); color: var(--hi-ink); border: 2px solid var(--ink); border-radius: 99px; padding: 4px 16px; animation: rise 0.7s ease forwards; }

/* resultat */
.res { text-align: center; margin: 18px 0 20px; }
.res .num { font-size: clamp(64px, 22vw, 96px); line-height: 1; font-weight: 700; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.res .num.pop { animation: pop 0.45s ease; }
.res .stars { font-size: 44px; letter-spacing: 6px; margin: 8px 0; }
.res .stars span { display: inline-block; }
.res .stars .on { animation: pop 0.5s ease backwards; }
.res .stars span:nth-child(2) { animation-delay: 0.12s; }
.res .stars span:nth-child(3) { animation-delay: 0.24s; }
.res p { margin: 6px 0; color: var(--ink2); }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 16px 0; }
.tile { border: 2px solid var(--ink); border-radius: 12px; background: var(--card); padding: 10px 6px; text-align: center; }
.tile b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.tile span { font-size: 12px; color: var(--ink2); }
.lvl { background: var(--hi); color: var(--hi-ink); border: 2px solid var(--ink); border-radius: 12px; padding: 10px 14px; font-weight: 700; text-align: center; margin: 12px 0; }
.miss { margin: 20px 0 6px; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; }
.row { display: grid; gap: 4px; padding: 12px 0; border-top: 2px dashed var(--soft); }
.row:first-of-type { border-top: 0; }
.row .q { color: var(--ink2); font-family: var(--f-math); font-size: 17px; overflow-wrap: anywhere; }
.row .a { font-family: var(--f-math); font-size: 20px; overflow-wrap: anywhere; }
.row .e { color: var(--ink2); font-size: 14px; }
.row .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--bad); margin-right: 6px; vertical-align: middle; }

/* fusklapp */
.search { width: 100%; padding: 12px 14px; border: 2px solid var(--ink); border-radius: 12px; background: var(--card); color: var(--ink); font: inherit; margin: 6px 0 16px; }
details.cz { border: 2px solid var(--ink); border-radius: 14px; background: var(--card); margin-bottom: 12px; box-shadow: 0 4px 0 var(--ink); }
details.cz > summary { list-style: none; cursor: pointer; padding: 14px 14px; font-weight: 700; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
details.cz > summary::-webkit-details-marker { display: none; }
details.cz > summary span { color: var(--ink2); font-weight: 500; font-size: 14px; }
details.cz .body { padding: 0 14px 8px; }
.empty { padding: 24px 6px; color: var(--ink2); text-align: center; }

@keyframes pop { 0% { transform: scale(0.7); } 60% { transform: scale(1.18); } 100% { transform: scale(1); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@keyframes rise { 0% { opacity: 0; transform: translate(-50%, 12px) scale(0.9); } 20% { opacity: 1; transform: translate(-50%, 0) scale(1); } 100% { opacity: 0; transform: translate(-50%, -30px) scale(1); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

  BANK.forEach(function (q) { q.id = q.z + "." + hash(q.q + "|" + q.a); });

  /* ---------- lagring ---------- */
  var KEY = "tentajakt.v1";
  function blank() { return { xp: 0, stars: {}, q: {}, best: 0, days: 0, last: "", snd: 1, games: 0 }; }
  function load() {
    try { var r = localStorage.getItem(KEY); if (r) { return Object.assign(blank(), JSON.parse(r)); } } catch (e) { }
    return blank();
  }
  var S = load();
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } }

  /* ---------- hjälpare ---------- */
  var app = document.getElementById("app");
  function $(s) { return document.querySelector(s); }
  function esc(c) { return c === "&" ? "&amp;" : c === "<" ? "&lt;" : c === ">" ? "&gt;" : c; }
  function grab(s, i) {
    var d = 1, j = i + 2;
    while (j < s.length && d > 0) { var ch = s[j]; if (ch === "{") d++; else if (ch === "}") d--; j++; }
    return { kind: s[i], inner: s.slice(i + 2, j - 1), end: j };
  }
  function R(s) {
    var out = "", i = 0;
    while (i < s.length) {
      var c = s[i];
      if ((c === "^" || c === "_") && s[i + 1] === "{") {
        var a = grab(s, i), b = null, n = a.end;
        if ((s[n] === "^" || s[n] === "_") && s[n] !== c && s[n + 1] === "{") { b = grab(s, n); }
        if (b) {
          var up = a.kind === "^" ? a : b, dn = a.kind === "_" ? a : b;
          out += '<span class="ss"><sup>' + R(up.inner) + "</sup><sub>" + R(dn.inner) + "</sub></span>";
          i = b.end;
        } else {
          out += (c === "^" ? "<sup>" : "<sub>") + R(a.inner) + (c === "^" ? "</sup>" : "</sub>");
          i = a.end;
        }
      } else { out += esc(c); i++; }
    }
    return out;
  }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function ymd(d) { return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); }
  function liveDays() {
    var t = ymd(new Date()), y = ymd(new Date(Date.now() - 864e5));
    return (S.last === t || S.last === y) ? S.days : 0;
  }
  function touchDay() {
    var t = ymd(new Date()), y = ymd(new Date(Date.now() - 864e5));
    if (S.last === t) return;
    S.days = (S.last === y) ? S.days + 1 : 1; S.last = t;
  }
  function lvlInfo(xp) {
    var l = Math.floor(Math.sqrt(xp / 50)) + 1, lo = 50 * (l - 1) * (l - 1), hi = 50 * l * l;
    return { l: l, title: TITLES[Math.min(l - 1, TITLES.length - 1)], hi: hi, pct: Math.round(100 * (xp - lo) / (hi - lo)) };
  }
  function weakList() { return BANK.filter(function (q) { var r = S.q[q.id]; return r && r.w > 0 && r.b < 3; }); }
  function mastered(z) { return BANK.filter(function (q) { var r = S.q[q.id]; return q.z === z && r && r.b >= 3; }).length; }
  function inZone(z) { return BANK.filter(function (q) { return q.z === z; }); }
  function wt(q) { var r = S.q[q.id]; if (!r) return 3; var w = 1; if (r.w > 0 && r.b < 3) w += 3; if (r.b >= 3) w = 0.4; return w; }
  function pick(pool, n) {
    var a = pool.slice(), out = [];
    while (out.length < n && a.length) {
      var tot = 0, k = 0; a.forEach(function (q) { tot += wt(q); });
      var x = Math.random() * tot;
      for (; k < a.length - 1; k++) { x -= wt(a[k]); if (x <= 0) break; }
      out.push(a.splice(k, 1)[0]);
    }
    return out;
  }

  /* ---------- ljud ---------- */
  var AC = null;
  function ac() { try { if (!AC) { var C = window.AudioContext || window.webkitAudioContext; if (C) AC = new C(); } if (AC && AC.state === "suspended") AC.resume(); } catch (e) { } }
  function tone(f, t, d, type, v) {
    try {
      if (!S.snd || !AC) return;
      var o = AC.createOscillator(), g = AC.createGain(), s = AC.currentTime + t;
      o.type = type || "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(v || 0.12, s + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, s + d);
      o.connect(g); g.connect(AC.destination); o.start(s); o.stop(s + d + 0.02);
    } catch (e) { }
  }
  function sfx(k) {
    if (k === "ok") { tone(660, 0, 0.09, "triangle"); tone(880, 0.07, 0.12, "triangle"); }
    else if (k === "bad") { tone(160, 0, 0.22, "sawtooth", 0.09); }
    else if (k === "lvl") { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, i * 0.09, 0.18, "triangle"); }); }
  }
  function flash(msg) {
    var d = document.createElement("div"); d.className = "flash"; d.textContent = msg; document.body.appendChild(d);
    setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 750);
  }

  /* ---------- startsida ---------- */
  var G = null, resetArm = false;
  function stars(n, big) {
    var s = "";
    for (var i = 1; i <= 3; i++) s += '<span class="' + (i <= n ? "on" : "off") + '">' + (i <= n ? "★" : "☆") + "</span>";
    return '<span class="stars" aria-label="' + n + ' av 3 stjärnor">' + s + "</span>";
  }
  function home() {
    G = null; resetArm = false;
    var L = lvlInfo(S.xp), weak = weakList().length, days = liveDays(), h = "";
    h += '<div class="top"><span class="chip hi">SF1625</span><button class="ghost" data-a="snd">Ljud: ' + (S.snd ? "på" : "av") + "</button></div>";
    h += '<h1 class="brand">Tenta<mark>jakt</mark></h1>';
    h += '<p class="lede">Formlerna som återkommer på tentorna. Svara snabbt, bygg combo, ta stjärnor.</p>';
    h += '<div class="xp"><div class="xp-row"><span>Nivå ' + L.l + " · " + L.title + "</span><small>" + S.xp + " / " + L.hi + ' XP</small></div><div class="bar"><i style="width:' + L.pct + '%"></i></div></div>';
    h += '<div class="stack">';
    h += '<button class="btn primary" data-a="blixt"><span class="big">Blixt</span><small>60 sekunder, 3 liv. Rätt svar ger tid och combo. Rekord: ' + S.best + "</small></button>";
    h += '<button class="btn" data-a="weak"><b>Svaga punkter</b><small>' + (weak ? weak + " frågor du har missat. Träna tills de sitter." : "Tom än. Missa något först, så dyker det upp här.") + "</small></button>";
    h += '<button class="btn" data-a="cheat"><b>Fusklapp</b><small>Alla ' + BANK.length + " fakta som en lista att läsa före tentan.</small></button>";
    h += "</div>";
    h += '<div class="sec"><h2>Zoner</h2><span>10 frågor, 3 liv</span></div><div class="zones">';
    ZONES.forEach(function (z) {
      var tot = inZone(z.id).length, m = mastered(z.id);
      h += '<button class="zone" data-a="zone" data-z="' + z.id + '"><b>' + z.n + '</b><span class="sub">' + z.sub + '</span><span class="meta"><span class="w">' + z.w + "</span>" + stars(S.stars[z.id] || 0) + '<span class="mini" title="Behärskade ' + m + " av " + tot + '"><i style="width:' + Math.round(100 * m / tot) + '%"></i></span></span></button>';
    });
    h += "</div>";
    h += '<div class="foot"><span>' + (days ? days + (days === 1 ? " dag" : " dagar") + " i rad" : "Spela idag för att starta en svit") + '</span><button class="ghost" data-a="reset">Nollställ framsteg</button></div>';
    app.innerHTML = h; window.scrollTo(0, 0);
  }

  /* ---------- spelet ---------- */
  function mult() { return 1 + Math.min(4, Math.floor(G.streak / 3)); }
  function startGame(mode, zid) {
    if (mode === "weak" && !weakList().length) { flash("Inga svaga punkter ännu"); return; }
    if (G && G.timer) clearInterval(G.timer);
    G = { mode: mode, z: zid || null, lives: 3, streak: 0, bs: 0, score: 0, correct: 0, total: 0, miss: [], xp: 0, cur: null, locked: false, t: 60, n: 0, queue: [], asked: [], N: 0, timer: null, quitArm: false };
    if (mode === "zone") { G.queue = pick(inZone(zid), 10); G.N = G.queue.length; }
    if (mode === "weak") { G.queue = pick(weakList(), 12); G.N = G.queue.length; G.lives = 99; }
    if (mode === "blixt") {
      G.timer = setInterval(function () {
        if (!G || G.locked) return;
        G.t -= 0.1; var b = $("#tb"); if (b) { b.classList.toggle("low", G.t < 10); b.firstChild.style.width = Math.max(0, Math.min(100, G.t / 60 * 100)) + "%"; }
        if (G.t <= 0) { G.t = 0; finish(false); }
      }, 100);
    }
    nextQ();
  }
  function nextQ() {
    if (G.mode === "blixt") {
      var rec = G.asked.slice(-20);
      var pool = BANK.filter(function (q) { return rec.indexOf(q.id) < 0; });
      G.cur = pick(pool, 1)[0];
    } else {
      if (G.n >= G.queue.length) { finish(true); return; }
      G.cur = G.queue[G.n];
    }
    G.n++;
    G.opts = shuffle([G.cur.a].concat(G.cur.d)); G.ci = G.opts.indexOf(G.cur.a);
    G.locked = false; G.asked.push(G.cur.id);
    drawGame();
  }
  function pips() {
    var s = ""; for (var i = 0; i < 3; i++) s += '<i class="pip' + (i < G.lives ? "" : " gone") + '"></i>';
    return s;
  }
  function drawGame() {
    var q = G.cur, h = "";
    h += '<div class="hud"><button class="ghost" data-a="quit" id="qb">Avbryt</button>';
    if (G.mode === "weak") h += '<span class="count">Träning</span>'; else h += '<div class="lives" id="lv">' + pips() + "</div>";
    h += '<span class="combo" id="cmb">×' + mult() + '</span><span class="score" id="sc">' + G.score + "</span></div>";
    if (G.mode === "blixt") h += '<div class="bar' + (G.t < 10 ? " low" : "") + '" id="tb"><i style="width:' + Math.min(100, G.t / 60 * 100) + '%"></i></div>';
    else h += '<div class="bar" id="tb"><i style="width:' + Math.round(100 * (G.n - 1) / G.N) + '%"></i></div>';
    h += '<div class="qcard"><span class="zn">' + ZN[q.z].n + (G.mode !== "blixt" ? " · " + G.n + "/" + G.N : "") + '</span><div class="qtext' + (q.q.length > 52 ? " long" : "") + '">' + R(q.q) + "</div></div>";
    h += '<div class="opts">';
    G.opts.forEach(function (o, i) { h += '<button class="opt' + (o.length > 36 ? " long" : "") + '" data-a="opt" data-i="' + i + '">' + R(o) + "</button>"; });
    h += '</div><div id="fbbox"></div>';
    app.innerHTML = h; window.scrollTo(0, 0);
  }
  function answer(i) {
    if (!G || G.locked) return;
    G.locked = true;
    var q = G.cur, ok = (i === G.ci), r = S.q[q.id] || (S.q[q.id] = { b: 0, w: 0, s: 0 });
    r.s++; G.total++;
    var old = mult();
    if (ok) {
      G.streak++; G.correct++; G.bs = Math.max(G.bs, G.streak);
      var m = mult(); G.score += 10 * m; G.xp += 4 * m; r.b = Math.min(4, r.b + 1);
      if (G.mode === "blixt") G.t = Math.min(90, G.t + 2);
      sfx("ok"); if (m > old) { flash("Combo ×" + m); }
    } else {
      G.streak = 0; r.w++; r.b = 0; G.miss.push(q); if (G.mode !== "weak") G.lives--; sfx("bad");
    }
    save();
    Array.prototype.forEach.call(app.querySelectorAll(".opt"), function (b, k) {
      b.disabled = true;
      if (k === G.ci) b.classList.add("ok"); else if (k === i) b.classList.add("bad"); else b.classList.add("dim");
    });
    var cm = $("#cmb"), sc = $("#sc"), lv = $("#lv");
    if (cm) { cm.textContent = "×" + mult(); cm.classList.remove("pop"); void cm.offsetWidth; cm.classList.add("pop"); }
    if (sc) sc.textContent = G.score;
    if (lv) lv.innerHTML = pips();
    var over = G.mode !== "weak" && G.lives <= 0;
    if (ok) {
      setTimeout(function () { if (G && G.cur === q) advance(); }, 650);
    } else {
      var fb = '<div class="fb bad"><h3>Fel</h3><p>Rätt svar: <span class="ans">' + R(q.a) + "</span></p>" + (q.e ? "<p>" + R(q.e) + "</p>" : "") +
        '<button class="btn primary center" data-a="next">' + (over ? "Se resultat" : "Nästa") + "</button></div>";
      $("#fbbox").innerHTML = fb;
      try { $("#fbbox").scrollIntoView({ block: "nearest", behavior: "smooth" }); } catch (e) { }
    }
  }
  function advance() {
    if (!G) return;
    if (G.mode !== "weak" && G.lives <= 0) { finish(false); return; }
    if (G.mode === "blixt" && G.t <= 0) { finish(false); return; }
    nextQ();
  }
  function quit() {
    if (!G) return;
    var b = $("#qb");
    if (!G.quitArm) { G.quitArm = true; if (b) b.textContent = "Säker? Tryck igen"; return; }
    clearInterval(G.timer); S.xp += G.xp; save(); home();
  }

  /* ---------- resultat ---------- */
  function finish(win) {
    clearInterval(G.timer); G.timer = null; G.locked = true;
    var st = 0, newBest = false;
    if (G.mode === "zone") {
      if (win && G.lives > 0) st = G.lives;
      if (st > (S.stars[G.z] || 0)) S.stars[G.z] = st;
      G.xp += st * 20;
    }
    if (G.mode === "blixt" && G.score > S.best) { S.best = G.score; newBest = G.score > 0; }
    var before = lvlInfo(S.xp).l; S.xp += G.xp; var after = lvlInfo(S.xp);
    touchDay(); S.games++; save();
    var h = "", title;
    if (G.mode === "zone") title = st ? "Zonen klar" : "Slut på liv";
    else if (G.mode === "blixt") title = G.lives <= 0 ? "Slut på liv" : "Tiden är slut";
    else title = "Träningen klar";
    h += '<div class="hud"><button class="ghost" data-a="home">← Hem</button><span class="count">' + (G.mode === "zone" ? ZN[G.z].n : G.mode === "blixt" ? "Blixt" : "Svaga punkter") + "</span></div>";
    h += '<div class="res"><span class="chip hi">' + title + "</span>";
    if (G.mode === "blixt") h += '<div class="num pop">' + G.score + "</div><p>" + (newBest ? "Nytt rekord" : "Rekord: " + S.best) + "</p>";
    else h += '<div class="num pop">' + G.correct + "/" + G.total + "</div>";
    if (G.mode === "zone") h += stars(st).replace('class="stars"', 'class="stars" style="display:block"');
    h += "</div>";
    h += '<div class="tiles"><div class="tile"><b>' + G.correct + "/" + G.total + "</b><span>Rätt</span></div><div class=\"tile\"><b>×" + (1 + Math.min(4, Math.floor(G.bs / 3))) + "</b><span>Bästa combo</span></div><div class=\"tile\"><b>+" + G.xp + "</b><span>XP</span></div></div>";
    if (after.l > before) { h += '<div class="lvl">Ny nivå: ' + after.title + " (nivå " + after.l + ")</div>"; sfx("lvl"); }
    var seen = {}, uniq = G.miss.filter(function (q) { if (seen[q.id]) return false; seen[q.id] = 1; return true; });
    h += '<div class="stack"><button class="btn primary center" data-a="again">Spela igen</button></div>';
    if (uniq.length) {
      h += '<h2 class="miss">Det här missade du</h2>';
      uniq.forEach(function (q) { h += '<div class="row"><div class="q">' + R(q.q) + '</div><div class="a">' + R(q.a) + "</div>" + (q.e ? '<div class="e">' + R(q.e) + "</div>" : "") + "</div>"; });
    } else if (G.total) {
      h += '<p class="empty">Inga misstag. Bra.</p>';
    }
    app.innerHTML = h; window.scrollTo(0, 0);
  }

  /* ---------- fusklapp ---------- */
  function cheat() {
    G = null;
    var h = '<div class="hud"><button class="ghost" data-a="home">← Hem</button><span class="count">' + BANK.length + " fakta</span></div>";
    h += '<h1 class="brand" style="font-size:clamp(36px,11vw,48px)">Fusklapp</h1>';
    h += '<input id="srch" class="search" type="search" placeholder="Sök, t.ex. arctan, Taylor, p-test" autocomplete="off" autocapitalize="off" spellcheck="false"><div id="cl"></div>';
    app.innerHTML = h; window.scrollTo(0, 0); fillCheat("");
  }
  function fillCheat(term) {
    term = term.trim().toLowerCase();
    var out = "";
    ZONES.forEach(function (z) {
      var items = BANK.filter(function (q) { return q.z === z.id && (!term || (q.q + " " + q.a + " " + q.e).toLowerCase().indexOf(term) >= 0); });
      if (!items.length) return;
      out += '<details class="cz"' + (term ? " open" : "") + "><summary>" + z.n + "<span>" + items.length + '</span></summary><div class="body">';
      items.forEach(function (q) {
        var r = S.q[q.id], weak = r && r.w > 0 && r.b < 3;
        out += '<div class="row"><div class="q">' + (weak ? '<i class="dot"></i>' : "") + R(q.q.replace(/\s*=\s*\?\s*$/, " =")) + '</div><div class="a">' + R(q.a) + "</div>" + (q.e ? '<div class="e">' + R(q.e) + "</div>" : "") + "</div>";
      });
      out += "</div></details>";
    });
    $("#cl").innerHTML = out || '<p class="empty">Inget matchar.</p>';
  }

  /* ---------- händelser ---------- */
  app.addEventListener("click", function (e) {
    var t = e.target.closest("[data-a]"); if (!t) return;
    ac();
    var a = t.getAttribute("data-a");
    if (a === "blixt") startGame("blixt");
    else if (a === "weak") startGame("weak");
    else if (a === "zone") startGame("zone", t.getAttribute("data-z"));
    else if (a === "cheat") cheat();
    else if (a === "home") { if (G && G.timer) clearInterval(G.timer); home(); }
    else if (a === "opt") answer(+t.getAttribute("data-i"));
    else if (a === "next") advance();
    else if (a === "quit") quit();
    else if (a === "again") { var m = G.mode, z = G.z; startGame(m, z); }
    else if (a === "snd") { S.snd = S.snd ? 0 : 1; save(); home(); }
    else if (a === "reset") {
      if (!resetArm) { resetArm = true; t.textContent = "Tryck igen för att nollställa"; }
      else { S = blank(); save(); home(); }
    }
  });
  app.addEventListener("input", function (e) { if (e.target && e.target.id === "srch") fillCheat(e.target.value); });

  home();
})();

</script>

</body></html>
